name: Build APK from ZIP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP="$(ls -1 *.zip 2>/dev/null | head -1)"
          if [ -z "$ZIP" ]; then echo "No .zip file found in repo root"; ls -la; exit 1; fi
          echo "Using $ZIP"
          mkdir -p project
          unzip -q -o "$ZIP" -d project
          SETTINGS="$(find project -name settings.gradle.kts -not -path '*/.*' | head -1)"
          if [ -z "$SETTINGS" ]; then echo "settings.gradle.kts not found inside zip"; find project | head -50; exit 1; fi
          echo "PROJ=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        continue-on-error: true
        run: |
          SDKM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace -p "$PROJ"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SocialApp-debug-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
